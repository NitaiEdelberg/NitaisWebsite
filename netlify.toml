# The whole app on Netlify: the React build on the CDN, and the Express API as
# a serverless function beside it.
#
# It used to be a CDN frontend proxying /api to a Render instance. That instance
# sleeps after 15 minutes idle and takes 60-90 seconds to wake, so the first
# visitor of the day waited a minute for an empty watchlist. A function
# cold-starts in about a second, and a warm one in milliseconds.
#
# Render still runs from backend/server.js and still works — this does not
# delete that path, it stops depending on it.

[build]
  # Repo root, not frontend/: the function imports backend/, so the build has
  # to install the root dependencies too.
  command = "npm install && npm install --prefix frontend && npm run build --prefix frontend"
  publish = "frontend/dist"
  functions = "netlify/functions"

# Netlify scans the build output for the VALUE of every environment variable
# set on the site, and fails the build when it finds one. That is the right
# default for a key and the wrong one for PORT, whose value (5000) appears as a
# local default in backend/server.js, the dev proxy target, and the README.
#
# The real fix is not to set PORT on Netlify at all — a serverless function has
# no port to listen on, so the variable does nothing here. This line exists so
# the build does not fail for anyone who copies the whole environment across
# from Render, which is exactly what the deploy guide tells them to do.
#
# Nothing else is exempted. A key that showed up in the build output would
# still fail the build, and should.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "PORT"

[functions]
  # esbuild bundles the function and its imports into one file, which keeps the
  # cold start near a second instead of unpacking node_modules.
  node_bundler = "esbuild"

# Every API path goes to the one function, which routes internally through the
# same Express app the server uses.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA fallback: every other path serves the React app for client-side routing.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
