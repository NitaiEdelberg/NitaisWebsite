# Netlify config — deploys the React frontend to Netlify's CDN (instant load,
# always on) while the Express + MongoDB backend keeps running on Render as a
# pure API.
#
# The app fetches relative paths like /api/movies. The redirect below proxies
# those to the Render backend, so:
#   • the frontend code needs NO change (still same-origin from the browser's view)
#   • no CORS setup is needed (Netlify proxies server-side)
#   • the page shell loads instantly from the CDN even if the backend is cold.

[build]
  base = "frontend"
  command = "npm install && npm run build"
  publish = "dist"

# API calls → Render backend (server-side proxy, so it stays same-origin).
[[redirects]]
  from = "/api/*"
  to = "https://nitaiswebsite.onrender.com/api/:splat"
  status = 200
  force = true

# SPA fallback: every other path serves the React app for client-side routing.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
